<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pacely</title>
<meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pacely">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#FBF7F1;--card:#FFFFFF;--card2:#F4EFE7;--ink:#2B2A33;--muted:#77737F;--line:#ECE6DD;
  --accent:#2F7D78;--accent-ink:#FFFFFF;--danger:#C2513F;--tint:.26;--shadow:0 1px 2px rgba(40,30,20,.06),0 6px 20px rgba(40,30,20,.06);
  --r:18px;--tab:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C;--card:#1F2229;--card2:#262A32;--ink:#ECEAF0;--muted:#9A97A3;--line:#2D3039;
  --accent:#5CC3B8;--accent-ink:#0F2A28;--danger:#E8806F;--tint:.22;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#15171C;--card:#1F2229;--card2:#262A32;--ink:#ECEAF0;--muted:#9A97A3;--line:#2D3039;
  --accent:#5CC3B8;--accent-ink:#0F2A28;--danger:#E8806F;--tint:.22;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,Ubuntu,sans-serif;}
body{min-height:100vh;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/AtkinsonHyperlegible-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url(fonts/AtkinsonHyperlegible-Bold.ttf) format('truetype');font-weight:600 800;font-display:swap}
@font-face{font-family:'OpenDyslexic';src:url(fonts/OpenDyslexic-Regular.otf) format('opentype');font-display:swap}
html[data-font=easy] body{font-family:'Atkinson Hyperlegible',sans-serif;letter-spacing:.01em;line-height:1.5}
html[data-font=dyslexic] body{font-family:'OpenDyslexic',sans-serif;letter-spacing:.03em;word-spacing:.12em;line-height:1.65;font-size:15px}
.trip{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}.trip .i{font-size:20px;line-height:1.2}
.commute .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.commute .chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--line)}
.commute .chip.bad{background:#F6C45355}
.srcs{font-size:13px;margin-top:10px}.srcs a{color:inherit;opacity:.75}
button{cursor:pointer;border:0;background:none;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
h1{font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-size:19px;margin:22px 0 10px}
.sub{color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:600}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.muted{color:var(--muted)}
.hidden{display:none!important}
input[type=text],input[type=password],input[type=time],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:10px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs button{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.tabs button span{display:grid;place-items:center;height:24px;font-size:22px}
.tabs button .pi{width:22px;height:22px}
.pi{vertical-align:-0.15em;flex:none}
.mood-ic{display:inline-grid;place-items:center}
.tabs button.on{color:var(--accent)}
.tabs button.on span{color:var(--accent)}

/* week strip */
.week{display:flex;gap:6px;margin:16px 0 4px;align-items:center}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;font-size:12px;color:var(--muted)}
.week .d b{font-size:17px;color:var(--ink)}
.week .d.sel{background:var(--accent);color:var(--accent-ink)}
.week .d.sel b{color:var(--accent-ink)}
.week .d.today:not(.sel) b{color:var(--accent)}
.week .dot{height:5px;width:22px;border-radius:3px;background:var(--line);overflow:hidden}
.week .dot i{display:block;height:100%;background:var(--accent)}
.week .d.sel .dot{background:rgba(255,255,255,.35)}.week .d.sel .dot i{background:var(--accent-ink)}
.week .arr{width:30px;height:40px;font-size:20px;color:var(--muted)}

/* now card */
.now{display:flex;gap:14px;align-items:center;margin:14px 0 6px}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .e{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.now .t{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.now .n{font-size:20px;font-weight:700;margin:2px 0}

/* timeline */
.tl{position:relative;margin-top:12px}
.item{display:flex;gap:12px;margin-bottom:10px;align-items:stretch}
.item .tm{width:46px;flex:none;text-align:right;font-size:13px;color:var(--muted);padding-top:12px;font-variant-numeric:tabular-nums}
.blk{flex:1;display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 12px 12px 12px;position:relative;text-align:left;
  background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--card));transition:transform .15s}
.blk:active{transform:scale(.985)}
.blk .em{width:42px;height:42px;flex:none;border-radius:13px;background:var(--c);display:grid;place-items:center;font-size:22px;color:rgba(0,0,0,.72)}
.blk .em .pi{width:24px;height:24px}
.blk .ti{font-weight:700;font-size:16px;line-height:1.25}
.blk .me{font-size:13px;color:var(--muted);margin-top:2px}
.blk .bar{height:5px;border-radius:3px;background:rgba(127,127,127,.18);margin-top:8px;overflow:hidden;max-width:160px}
.blk .bar i{display:block;height:100%;background:var(--c)}
.blk.done{opacity:.55}.blk.done .ti{text-decoration:line-through}
.blk.cur{outline:2.5px solid var(--c);outline-offset:2px}
.chk{width:30px;height:30px;flex:none;border-radius:50%;border:2.5px solid var(--muted);display:grid;place-items:center;font-size:16px;margin-left:auto;align-self:center;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:7px;background:var(--c);color:#1d1d22;margin-left:6px;vertical-align:2px}
.gap{margin:0 0 10px 58px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.gap:before{content:"";flex:none;width:14px;border-top:2px dotted var(--line)}
.nowline{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--danger);font-size:12px;font-weight:700}
.nowline .tm{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.nowline:after{content:"";flex:1;border-top:2px solid var(--danger)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.fab{position:fixed;right:18px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 16px);width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:32px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:15;display:grid;place-items:center}
@media(min-width:760px){.fab{right:calc(50% - 360px + 18px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.45);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);z-index:41;border-radius:24px 24px 0 0;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:22px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{min-height:40px;padding:0 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:15px}
.choice.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:22px;background:var(--card)}
.emojis button.on{outline:2.5px solid var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:38px;height:38px;border-radius:50%;background:var(--c)}
.swatches button.on{outline:3px solid var(--ink);outline-offset:2px}
.steps .st{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps .st:last-child{border-bottom:0}
.steps .st span{flex:1}
.steps .st.on span{text-decoration:line-through;color:var(--muted)}
.stepedit{display:flex;gap:8px;margin-bottom:8px}
.stepedit button{width:48px;flex:none;border-radius:13px;background:var(--card2);font-size:18px}
.bigemoji{font-size:54px;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:var(--c);margin-bottom:10px;color:rgba(0,0,0,.72)}

/* todo */
.todo{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.todo .tt{flex:1;cursor:pointer}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo .em{font-size:20px}

/* focus */
.timer{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:18px auto 8px}
.timer svg{width:100%;height:100%}
.timer .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .c b{font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:var(--bg);padding:2px 14px;border-radius:16px}
.ctrl{display:flex;gap:10px;justify-content:center;margin:12px 0}

/* routines */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{text-align:left;padding:16px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.rcard .e{font-size:30px}
.rcard b{display:block;margin-top:6px;font-size:17px}
.ritem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ritem .e{width:36px;height:36px;border-radius:11px;background:var(--c);display:grid;place-items:center}
.redit{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.redit .row input{min-height:42px}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:34px;padding:8px 0;border-radius:14px;background:var(--card2)}
.moods button.on{outline:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.mhist{display:flex;gap:4px;align-items:flex-end;height:60px;margin:10px 0}
.mhist i{flex:1;border-radius:4px 4px 0 0;background:var(--accent);opacity:.8;min-height:3px}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:3px;margin-top:14px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.allday{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.allday span{font-size:13px;font-weight:600;padding:5px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--card))}
.wk{margin-top:14px;display:grid;gap:10px}
.wkday{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.wkday.today{outline:2px solid var(--accent)}
.wkday h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.wkday h4 small{color:var(--muted);font-weight:600}
.wkrow{display:flex;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.wkrow .t{width:42px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.wkrow .s{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.wkrow.done{opacity:.5;text-decoration:line-through}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.mon .h{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:4px 0}
.mon button{aspect-ratio:1/1.15;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-weight:700;font-size:15px}
.mon button.out{opacity:.35}
.mon button.today{outline:2px solid var(--accent)}
.mon button.sel{background:var(--accent);color:var(--accent-ink)}
.mon .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:34px}
.mon .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.late{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px;background:var(--card2)}
.move{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.move button{min-height:42px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:600;font-size:13px}
.prio{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:8px;background:var(--card2);color:var(--muted);flex:none}
.prio.now{background:color-mix(in srgb,#F07F6E 30%,var(--card));color:var(--ink)}
.prio.later{opacity:.7}
.ghead{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 2px;display:flex;gap:8px;align-items:center}
.aicard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1.5px solid var(--line)}
.aicard.off{opacity:.45}
.aicard .em{font-size:24px}
.aicard ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.trophy{text-align:center;padding:10px 4px;border-radius:14px;background:var(--card2);font-size:11px;font-weight:600;line-height:1.2}
.trophy span{display:block;font-size:26px;margin-bottom:4px}
.trophy.no{opacity:.35;filter:grayscale(1)}
.energy{display:flex;gap:6px}
.energy button{flex:1;min-height:46px;border-radius:12px;background:var(--card2);font-size:13px;font-weight:700}
.energy button.on{outline:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px;margin:12px 0 4px}
.bars i{flex:1;border-radius:4px 4px 0 0;background:var(--accent);min-height:3px}
.codebox{font:13px ui-monospace,Menlo,monospace;background:var(--card2);padding:10px;border-radius:10px;word-break:break-all;user-select:all}
.stepedit input.m{width:70px;flex:none;text-align:center}
.reviewcard{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 0;margin-top:10px}
.msg{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.prov{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prov button{text-align:left;padding:12px;border-radius:14px;background:var(--card2);border:2px solid transparent}
.prov button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.prov b{display:block;margin-bottom:4px}
.prov small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.blk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drop{outline:3px dashed var(--accent)!important;outline-offset:3px;border-radius:14px}
.ghost{position:fixed;z-index:90;pointer-events:none;opacity:.92;transform:scale(.96) rotate(-1deg);box-shadow:0 16px 40px rgba(0,0,0,.25);border-radius:var(--r);max-width:min(560px,88vw)}
.ghost .badge{position:absolute;top:-14px;right:10px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:5px 10px;border-radius:10px;white-space:nowrap}
body.dragging{overflow:hidden;-webkit-user-select:none;user-select:none}
.tray{margin:14px 0 4px}
.tray .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.tchip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--card));font-weight:600;font-size:14px;max-width:220px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.tchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:60;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:380px;margin:18vh auto 0;padding:0 20px;text-align:center}
.login .logo{width:84px;height:84px;border-radius:24px;margin:0 auto 14px;display:block}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set .l{flex:1}
.set .l small{display:block;color:var(--muted);font-size:13px}
/* AI thinking glow */
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
#aiGlow{position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0;transition:opacity .6s}
#aiGlow.on{opacity:1}
#aiGlow i{position:absolute;inset:0;border-radius:inherit;padding:14px;background:conic-gradient(from var(--ga),#73CBA8,#7CB8F0,#B89AE8,#EE8FA6,#F6C453,#73CBA8);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(12px);animation:gturn 6s linear infinite,gbreathe 4s ease-in-out infinite}
#aiGlow span{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--card);box-shadow:var(--shadow);padding:6px 6px 6px 16px;border-radius:999px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;pointer-events:auto;white-space:nowrap}
#aiGlow i.crisp{padding:3px;filter:blur(1px)}
#aiGlow em{font-style:normal;font-variant-numeric:tabular-nums}
#aiGlow button{border:0;border-radius:999px;padding:6px 12px;font:inherit;background:var(--line,#0001);color:inherit;cursor:pointer}
#aiGlow:not(.on) span{pointer-events:none}
@keyframes gturn{to{--ga:360deg}}
@keyframes gbreathe{0%,100%{opacity:.6}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#aiGlow i{animation:gbreathe 4s ease-in-out infinite}}
/* native feel (inside the iPhone and Mac apps) */
html.native,html.native body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html.native input,html.native textarea,html.native .selectable{-webkit-user-select:text;user-select:text}
html.native button:active,html.native .choice:active,html.native .item:active{transform:scale(.97);transition:transform .08s}
.swipe-out-l{animation:swl .18s ease-in forwards}.swipe-out-r{animation:swr .18s ease-in forwards}
.swipe-in-l{animation:swil .2s ease-out}.swipe-in-r{animation:swir .2s ease-out}
@keyframes swl{to{transform:translateX(-30px);opacity:0}}@keyframes swr{to{transform:translateX(30px);opacity:0}}
@keyframes swil{from{transform:translateX(30px);opacity:0}}@keyframes swir{from{transform:translateX(-30px);opacity:0}}
.callbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,#73CBA8 35%,var(--card));font-weight:700;text-decoration:none;color:var(--ink)}
.micbtn{width:50px;min-height:50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:22px;flex:none}
.xitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.xitem:last-child{border:0}
.xitem .chk{flex:none}
/* less friction */
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px}
.toast.act button{color:var(--bg);font-weight:800;text-decoration:underline;padding:4px 2px}
.qadd{display:flex;gap:8px;margin:14px 0 0}
.qadd input{flex:1;min-height:50px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;padding:12px 14px}
.qadd input:focus{border-color:var(--accent);outline:none}
.qadd button{width:50px;min-height:50px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:26px;font-weight:700;flex:none}
.qhint{font-size:14px;color:var(--accent);margin:6px 4px 0;min-height:0}
.recent{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100%),var(--card));white-space:nowrap}
.allday button,.allday span{font-size:14px;font-weight:600;padding:7px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) calc(var(--tint)*100% + 10%),var(--card))}
.quiet{display:flex;gap:12px;align-items:center;margin-top:12px}
.quiet .big{font-size:30px}
.left{margin-top:12px}
.left ul{margin:6px 0 10px;padding-left:20px}
.left li{margin:2px 0}
.isteps{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.istep{display:flex;align-items:center;gap:8px;text-align:left;font-size:14px;padding:4px 0;min-height:30px;line-height:1.25}
.istep .bx{width:20px;height:20px;border-radius:6px;border:2px solid color-mix(in srgb,var(--c) 70%,var(--ink));flex:none;display:grid;place-items:center;font-size:12px;font-weight:900}
.istep.on{opacity:.6;text-decoration:line-through}
.istep.on .bx{background:var(--c);border-color:var(--c)}
.istep.on .bx::after{content:"✓";color:#222}
.from{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;background:color-mix(in srgb,#EE8FA6 30%,var(--card));margin-left:6px;vertical-align:1px}
.ehint{font-size:14px;color:var(--accent);margin-top:6px}
.share{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.share:first-child{border:0;margin:0;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs hidden" id="tabs">
  <button data-v="today"><span>🗓️</span>Today</button>
  <button data-v="todo"><span>✅</span>To-do</button>
  <button data-v="focus"><span>⏳</span>Focus</button>
  <button data-v="routines"><span>🔁</span>Routines</button>
  <button data-v="me"><span>🙂</span>Me</button>
</nav>
<button class="fab hidden" id="fab" aria-label="Add">+</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="ical.min.js"></script>
<script src="pacely-icons.js"></script>
<script src="smart.js"></script>
<script src="local.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#F6C453','#F4A07A','#F07F6E','#EE8FA6','#B89AE8','#7CB8F0','#73CBA8','#A8C686','#D9B99B','#9AA8BA'];
const EMOJIS=['📝','✅','⏰','🛏️','🚿','🦷','👕','🥣','☕','🍽️','🥪','🍎','🍳','🧺','🧹','🛒','🚗','🚶','🏃','🧘','📚','💻','📧','📞','🗒️','🎧','🎮','📺','🎨','🔧','🎙️','🎬','👶','🐾','🌳','💤','🛁','📦','💡','🧠','❤️','🎉','💼','🏠','🍼','🎒','💬','🌅'];
const icon=(n,px)=>window.PacelyIcons?PacelyIcons.icon(n,px):'';
function emojiIcon(e,px){let raw=false;try{raw=localStorage.getItem('pacely_fx_emoji')==='true'}catch(x){}if(raw||!window.PacelyIcons)return esc(e);return PacelyIcons.emojiIcon(e,px)||esc(e)}
const MOODS=[1,2,3,4,5].map(n=>`<span class="mood-ic">${window.PacelyIcons?PacelyIcons.icon('mood-'+n,26):['😞','😕','😐','🙂','😄'][n-1]}</span>`);
const MOODNAMES=['Rough','Low','Okay','Good','Great'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const S={view:'today',mode:'day',date:null,today:null,day:{items:[],moods:[],allday:[]},week:{},month:{},todos:[],routines:[],moods:[],me:null,showDone:false,ai:{ok:false}};
const IS_NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.pacely);
function native(msg){try{if(IS_NATIVE)window.webkit.messageHandlers.pacely.postMessage(msg)}catch(e){}}
const IS_IOS=IS_NATIVE&&window.PACELY_PLATFORM!=='mac';
document.querySelectorAll('.tabs button[data-v]').forEach(b=>{const n={today:'today',todo:'todo',focus:'focus',routines:'routines',me:'me'}[b.dataset.v];const sp=b.querySelector('span');if(sp&&window.PacelyIcons&&n)sp.innerHTML=PacelyIcons.icon(n,22)});
if(IS_NATIVE){document.documentElement.classList.add('native');
  const vp=document.querySelector('meta[name=viewport]');if(vp)vp.content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  document.addEventListener('gesturestart',e=>e.preventDefault())}
/* Sounds: put your own files in the sounds folder (see sounds/README.md). Missing ones fall back to a soft chime or silence. */
const FX={missing:{}};
function fxOn(k){try{return JSON.parse(localStorage.getItem('pacely_fx_'+k)??'true')}catch(e){return true}}
function fxSet(k,v){try{localStorage.setItem('pacely_fx_'+k,JSON.stringify(v))}catch(e){}}
function sfx(name,fallback){
  if(!fxOn('sound')){return}
  const tries=['sounds/'+name+'.mp3','sounds/'+name+'.m4a',name+'.mp3',name+'.m4a'].filter(u=>!FX.missing[u]);
  const play=i=>{if(i>=tries.length){if(fallback)fallback();return}
    const a=new Audio(tries[i]);a.volume=.7;a.play().catch(()=>{FX.missing[tries[i]]=1;play(i+1)})};
  play(0);
}
function haptic(style){if(!fxOn('haptic'))return;if(IS_IOS)native({type:'haptic',style:style||'light'});else try{navigator.vibrate&&navigator.vibrate(style==='success'?[10,40,10]:8)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button,.choice,a.btn,[data-open]'))haptic('light')},true);
const ENERGY=['Empty','Low','Okay','Good','Full'];
const PRIO={now:'Now',soon:'Soon',later:'Later'};

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const mon=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
const fmt=m=>`${pad(Math.floor((m%1440+1440)%1440/60))}:${pad(((m%60)+60)%60)}`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const dur=m=>m>=60?(m%60?`${Math.floor(m/60)}h ${m%60}m`:`${m/60}h`):`${m} min`;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
S.mode=lsGet('mode','day');
function toast(m,act){const t=$('#toast');t.textContent=m;t.classList.toggle('act',!!act);
  if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{t.classList.remove('on','act');act.fn()};t.appendChild(b)}
  t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on','act'),act?6000:2200)}
let MODE='server'; // 'server' = a Pacely server, 'local' = everything kept on this device
async function api(path,opt={}){
  if(MODE==='local'){
    try{return await LOCAL.call(opt.method||'GET',path,opt.body)}
    catch(e){sfx('gentle-error');toast(e.message||'Something went wrong');throw e}
  }
  const o={method:opt.method||'GET',headers:{},credentials:'same-origin'};
  if(opt.body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.body)}
  let r;
  try{r=await fetch(path,o)}catch(e){toast('Can’t reach Pacely – check your connection');throw e}
  if(r.status===401){showLogin();throw new Error('login')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){toast(j.error||'Something went wrong');throw new Error(j.error)}
  if(o.method!=='GET')native({type:'changed'});
  return j;
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
/* AI requests run on the server in the background; this waits for the answer */
async function aiCall(path,body){glowOn();try{return await aiCall2(path,body)}finally{glowOff()}}
/* A soft glow that travels round the screen edge while the AI helper thinks (breathes instead with reduced motion). */
let glowN=0,glowT=null,glowGen=0;
function glowOn(){glowN++;let g=$('#aiGlow');if(!g){g=document.createElement('div');g.id='aiGlow';g.innerHTML='<i></i><i class="crisp"></i><span>✨ <em>Thinking… 0s</em><button type="button">Cancel</button></span>';document.body.appendChild(g);
    g.querySelector('button').onclick=()=>{glowGen++;glowN=1;glowOff();toast('Stopped. Nothing was changed.')}}
  requestAnimationFrame(()=>g.classList.add('on'));const t0=Date.now();clearInterval(glowT);glowT=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);g.querySelector('em').textContent=(s<20?'Thinking… ':'Still thinking… ')+s+'s'},1000)}
function glowOff(){glowN=Math.max(0,glowN-1);if(glowN)return;clearInterval(glowT);const g=$('#aiGlow');if(g)g.classList.remove('on')}
async function aiCall2(path,body){
  const r=await api(path,{method:'POST',body:body||{}});
  if(!r.job)return r;
  const started=Date.now(),gen=glowGen;
  while(Date.now()-started<10*60*1000){
    await new Promise(res=>setTimeout(res,2500));
    if(gen!==glowGen){api('/api/ai/job/'+r.job+'/cancel',{method:'POST',body:{}}).catch(()=>{});throw new Error('cancelled')}
    let j;try{j=await api('/api/ai/job/'+r.job)}catch(e){continue}
    if(j.status==='done')return j.result;
    if(j.status==='error'){toast(j.error||'The AI helper didn’t answer');throw new Error(j.error)}
  }
  toast('The AI helper is taking too long. Try a shorter brain dump.');throw new Error('timeout');
}
function applyFont(f){if(f==='easy'||f==='dyslexic')document.documentElement.dataset.font=f;else delete document.documentElement.dataset.font;lsSet('font',f||'standard')}
applyFont(lsGet('font','standard'));
/* Live sync: a quiet line stays open to the server, and the screen refreshes the moment anything changes
   (on your phone, your partner's, the AI helper or a calendar). */
let syncV=-1,liveOn=false;const nap=ms=>new Promise(r=>setTimeout(r,ms));
async function liveLoop(){
  if(liveOn||MODE!=='server')return;liveOn=true;
  while(true){
    if(document.hidden){await nap(2000);continue}
    try{const r=await fetch('/api/live?v='+syncV+'&wait=25',{credentials:'same-origin'});if(!r.ok)throw new Error(r.status);
      const j=await r.json();const was=syncV;syncV=j.v;
      if(was>=0&&j.v!==was)liveRefresh()}
    catch(e){await nap(8000)}
  }
}
function liveRefresh(){ // wait while you're typing or dragging, so nothing you're doing gets wiped
  const ae=document.activeElement;
  if(DRAG||Date.now()-dragJustEnded<800||(ae&&$('#app').contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))){setTimeout(liveRefresh,2000);return}
  refresh()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&MODE==='server'&&S.me)liveRefresh()});
function applyTheme(t){if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;lsSet('theme',t)}
applyTheme(lsGet('theme','auto'));

/* ---------- sheet ---------- */
let sheetClose=null;
function openSheet(html,onClose){if(!$('#sheet').classList.contains('on'))sfx('open');$('#sheetBody').innerHTML=html;$('#sheet').scrollTop=0;$('#scrim').classList.add('on');$('#sheet').classList.add('on');sheetClose=onClose||null}
function closeSheet(){if($('#sheet').classList.contains('on'))sfx('close');$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');const f=sheetClose;sheetClose=null;if(f)f()}
$('#scrim').onclick=closeSheet;
function choose(title,options){ // options [{label,value,cls}]
  return new Promise(res=>{
    openSheet(`<h3>${esc(title)}</h3><div style="display:grid;gap:10px;margin-top:16px">${options.map((o,i)=>`<button class="btn block ${o.cls||''}" data-i="${i}">${esc(o.label)}</button>`).join('')}<button class="btn block" data-i="-1">Cancel</button></div>`,()=>res(null));
    $('#sheetBody').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sheetClose=null;closeSheet();res(i<0?null:options[i].value)});
  });
}

/* ---------- login ---------- */
function showLogin(){
  $('#tabs').classList.add('hidden');$('#fab').classList.add('hidden');
  $('#app').innerHTML=`<div class="login"><img class="logo" src="icon-180.png" alt=""><h1>Pacely</h1><p class="sub">Your calm, private day planner</p>
  <form id="lf" style="margin-top:24px;display:grid;gap:12px"><input type="password" id="lp" placeholder="Password" autocomplete="current-password">
  <button class="btn pri block" type="submit">Open</button><p class="sub" id="le"></p></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#lp').value})});
    if(r.ok)boot();else{const j=await r.json().catch(()=>({}));$('#le').textContent=j.error||'Wrong password'}};
  setTimeout(()=>$('#lp')&&$('#lp').focus(),100);
}

/* ---------- boot ---------- */
async function detectMode(){
  if(window.PACELY_MODE==='local')return 'local';
  if(window.PACELY_MODE==='server')return 'server';
  if(location.protocol==='file:')return 'local';
  try{const r=await fetch('/api/me',{credentials:'same-origin'});
    if((r.status===200||r.status===401)&&(r.headers.get('content-type')||'').includes('json'))return 'server'}catch(e){}
  return 'local';
}
async function start(){
  MODE=await detectMode();
  if(MODE==='local'){
    await LOCAL.ready;
    if(!LOCAL.hasData){showWelcome();return}
  }
  boot().catch(e=>{if(e.message!=='login')console.error(e)});
}
function showWelcome(){
  $('#tabs').classList.add('hidden');$('#fab').classList.add('hidden');
  $('#app').innerHTML=`<div class="login" style="margin-top:12vh"><img class="logo" src="icon-180.png" alt=""><h1>Pacely</h1><p class="sub">A calm, private day planner</p>
  <div class="card" style="margin-top:22px;text-align:left"><b>🔒 Your plans stay on this device</b><p class="sub" style="margin:6px 0 0">Nothing is sent anywhere. No account, no tracking. Save a copy any time from Me › Backup.</p></div>
  <div style="display:grid;gap:10px;margin-top:16px"><button class="btn pri block" id="wFresh">Start planning</button>
  <label class="btn block">Load a saved file…<input type="file" id="wFile" accept=".json,application/json" hidden></label></div>
  <details style="margin-top:22px;text-align:left"><summary class="sub" style="cursor:pointer">I have a Pacely server</summary>
  <form id="wSrv" class="row" style="margin-top:10px"><input type="text" id="wAddr" placeholder="plan.yourdomain.com" autocapitalize="off" autocorrect="off"><button class="btn" type="submit" style="flex:none">Go</button></form>
  <p class="sub" style="margin-top:8px">This opens your own server, where you log in with its password.</p></details></div>`;
  $('#wFresh').onclick=async()=>{await LOCAL.start(null);boot()};
  $('#wFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{await LOCAL.start(await f.text());toast('Your plans are loaded');boot()}catch(err){toast(err.message||'That file didn’t work')}};
  $('#wSrv').onsubmit=e=>{e.preventDefault();let a=$('#wAddr').value.trim();if(!a)return;if(!/^https?:\/\//i.test(a))a='https://'+a;location.href=a.replace(/\/+$/,'')+'/'};
}
async function boot(){
  S.me=await api('/api/me');
  applyTheme(S.me.theme);
  S.today=S.me.today;if(!S.date)S.date=S.today;
  $('#tabs').classList.remove('hidden');
  go(S.view);
  api('/api/ai/status').then(a=>{S.ai=a}).catch(()=>{});
  liveLoop();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
async function go(v){
  if(S.view&&S.view!==v)sfx('tab');S.view=v;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#fab').classList.toggle('hidden',!(v==='today'||v==='routines'));
  window.scrollTo(0,0);
  if(v==='today')await loadDay();
  else if(v==='todo'){S.todos=await api('/api/todos');renderTodo()}
  else if(v==='focus'){await adoptServerFocus();renderFocus()}
  else if(v==='routines'){S.routines=await api('/api/routines');renderRoutines()}
  else if(v==='me'){S.moods=await api('/api/moods');S.me=await api('/api/me');renderMe()}
}
$('#fab').onclick=()=>{if(S.view==='routines')editRoutine(null);else editActivity(null,{date:S.date})};

/* ---------- today ---------- */
async function loadDay(){
  const realToday=iso(new Date());
  if(realToday!==S.today){if(S.date===S.today)S.date=realToday;S.today=realToday}
  if(S.mode==='month'){
    const first=parse(S.date);first.setDate(1);let w=mon(iso(first));const weeks=[];
    for(let i=0;i<6;i++){weeks.push(w);w=addDays(w,7)}
    const res=await Promise.all(weeks.map(x=>api('/api/week?start='+x)));
    S.month=Object.assign({},...res);S.monthWeeks=weeks;renderToday();return;
  }
  const [day,week,todos]=await Promise.all([api('/api/day?date='+S.date),api('/api/week?start='+mon(S.date)),
    S.date>=S.today?api('/api/todos').catch(()=>[]):Promise.resolve([])]);
  S.day=day;S.week=week;S.todos=todos;
  const feats=(S.me&&S.me.features)||[];
  if(S.date===S.today&&feats.includes('leftovers')&&lsGet('leftDismiss','')!==S.today){S.left=await api('/api/leftovers').catch(()=>[])}else S.left=[];
  if(feats.includes('smart')&&Date.now()-(S.recentAt||0)>300000){S.recent=await api('/api/recent').catch(()=>[]);S.recentAt=Date.now()}
  bindSwipe();renderToday();
}

function trayHTML(){

function haptic(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}native({type:'haptic'})}
let DRAG=null,dragJustEnded=0;
function dropTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const day=el.closest('.week .d');if(day)return{el:day,date:day.dataset.d,label:parse(day.dataset.d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})};
  const blk=el.closest('[data-end]');
  if(blk&&blk.dataset.open!==String(DRAG.id)){const m=+blk.dataset.end;return{el:blk,start:fmt(m),label:`${fmt(m)} · after ${blk.dataset.title}`}}
  const at=el.closest('[data-at]');if(at){const m=+at.dataset.at;return{el:at,start:fmt(m),label:fmt(m)}}
  const any=el.closest('[data-any]');if(any)return{el:any,start:null,label:'Anytime'};
  if(DRAG.kind==='todo'&&el.closest('.tl,.now,.empty')){const m=Math.ceil(nowMin()/15)*15;const t=S.date===S.today?fmt(m):'09:00';return{el:el.closest('.tl,.now,.empty'),start:t,label:t}}

}
function dragStart(src,kind,id,x,y){
  const r=src.getBoundingClientRect();
  const g=src.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
  g.insertAdjacentHTML('beforeend','<div class="badge">Move…</div>');document.body.appendChild(g);
  DRAG={kind,id,ghost:g,dx:x-r.left,dy:y-r.top,target:null,src};src.style.opacity='.35';
  document.body.classList.add('dragging');haptic();sfx('pickup');
}
function dragMove(x,y){
  if(!DRAG)return;
  DRAG.ghost.style.left=(x-DRAG.dx)+'px';DRAG.ghost.style.top=(y-DRAG.dy)+'px';
  if(y>innerHeight-110)window.scrollBy(0,14);else if(y<90)window.scrollBy(0,-14);
  const t=dropTarget(x,y);
  if((t&&t.el)!==(DRAG.target&&DRAG.target.el)){if(DRAG.target)DRAG.target.el.classList.remove('drop');if(t){t.el.classList.add('drop');haptic();sfx('hover')}}

}
async function dragEnd(){
  if(!DRAG)return;const d=DRAG;DRAG=null;dragJustEnded=Date.now();
  d.ghost.remove();d.src.style.opacity='';document.body.classList.remove('dragging');
  if(d.target)d.target.el.classList.remove('drop');
  const t=d.target;if(!t)return;
  sfx('drop');

    if(d.kind==='todo'){
      const todo=S.todos.find(x=>x.id==d.id);
      await api('/api/activities/'+d.id,{method:'PUT',body:{kind:'event',date:t.date||S.date,start:t.date?(S.date===S.today?fmt(Math.ceil(nowMin()/15)*15):'09:00'):t.start,duration:(todo&&todo.duration)||30}});
      toast('Planned · '+t.label);
    }else{
      const it=findItem(d.id);const body={};
      if(t.date){if(t.date===(it.date||S.date))return;body.date=t.date}else body.start=t.start;
      if(it.master_id)body.scope='this';
      await api('/api/activities/'+d.id,{method:'PUT',body});
      toast('Moved · '+t.label);
    }
  }catch(e){}

}
function makeDraggable(el,kind,id){
  let timer=null,sx=0,sy=0,touchActive=false;
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const p=e.touches[0];sx=p.clientX;sy=p.clientY;touchActive=true;
    timer=setTimeout(()=>{timer=null;if(touchActive)dragStart(el,kind,id,sx,sy)},380)},{passive:true});
  el.addEventListener('touchmove',e=>{const p=e.touches[0];
    if(DRAG&&DRAG.src===el){e.preventDefault();dragMove(p.clientX,p.clientY);return}
    if(timer&&(Math.abs(p.clientX-sx)>10||Math.abs(p.clientY-sy)>10)){clearTimeout(timer);timer=null}},{passive:false});
  const endTouch=()=>{touchActive=false;if(timer){clearTimeout(timer);timer=null}if(DRAG&&DRAG.src===el)dragEnd()};
  el.addEventListener('touchend',endTouch);el.addEventListener('touchcancel',endTouch);
  el.addEventListener('contextmenu',e=>{if(DRAG||timer)e.preventDefault()});
  el.addEventListener('mousedown',e=>{if(e.button!==0||e.target.closest('[data-done]'))return;const x0=e.clientX,y0=e.clientY;let started=false;
    const mv=ev=>{if(!started&&(Math.abs(ev.clientX-x0)>6||Math.abs(ev.clientY-y0)>6)){started=true;dragStart(el,kind,id,x0,y0)}if(started)dragMove(ev.clientX,ev.clientY)};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);if(started)dragEnd()};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
}

/* Things don't always go to plan. Move what's left without it ever looking like a failure. */
async function couldnt(it){
  const steps=(it.steps||[]);const left=steps.filter(s=>!s.d),doneSteps=steps.filter(s=>s.d);
  const partial=doneSteps.length>0&&left.length>0;
  const nextWd=(()=>{let d=addDays(S.today,1);while([0,6].includes(parse(d).getDay()))d=addDays(d,1);return d})();
  const to=await choose(partial?`That's okay. You did ${doneSteps.length} of ${steps.length} steps. Where should the ${left.length===1?'last step':left.length+' steps left'} go?`:`That's okay. It happens. Where should it go?`,
    [{label:'Tomorrow',value:addDays(S.today,1)},...(nextWd!==addDays(S.today,1)?[{label:'Next weekday ('+parse(nextWd).toLocaleDateString('en-GB',{weekday:'short'})+')',value:nextWd}]:[]),
     {label:'Pick a day…',value:'pick'},{label:'My to-do list',value:'todo'},{label:'Let it go',value:'let_go'}]);
  if(!to)return;
  let date=to;
  if(to==='pick'){date=await pickDate(addDays(S.today,1));if(!date)return}
  if(partial){
    // keep what got done today, and carry just the unfinished steps on
    if(to!=='let_go'){const body={title:it.title,emoji:it.emoji,color:it.color,duration:Math.max(10,left.reduce((a,s)=>a+(s.m||0),0)||it.duration),
      steps:left.map(s=>({...s,d:false})),notes:it.notes||'',remind:it.remind||0,end_alert:it.end_alert??1};
      Object.assign(body,to==='todo'?{kind:'todo',priority:'soon'}:{kind:'event',date,start:null});
      await api('/api/activities',{method:'POST',body})}
    await api('/api/activities/'+it.id,{method:'PUT',body:{steps:doneSteps,done:true,...(it.master_id?{scope:'this'}:{})}});
  }else if(to==='let_go'){await api('/api/activities/'+it.id+'?scope=this',{method:'DELETE'})}
  else if(to==='todo'){await api('/api/activities/'+it.id,{method:'PUT',body:{kind:'todo',date:null,start:null,...(it.master_id?{scope:'this'}:{})}})}
  else{await api('/api/activities/'+it.id,{method:'PUT',body:{date,...(it.master_id?{scope:'this'}:{})}})}
  closeSheet();

}

  <div class="stepedit"><input type="text" id="eNewStep" placeholder="Add a step, press return"><button id="eAddStep" aria-label="Add">＋</button></div>

  ${(S.me.features||[]).includes('travel')?`<div class="row" style="margin-top:8px;align-items:center"><button class="btn sm" id="eTrip">🚗 When should I leave?</button><span class="sub" id="eTripT" style="flex:1">${esc(tripText(a))}</span></div>`:''}

  <div style="display:grid;gap:10px;margin-top:20px"><button class="btn pri block" id="eSave">${isNew?'Add':'Save'}</button><button class="btn block" id="eCancel">Cancel</button></div>`}
  function grab(){
    a.title=$('#eTitle').value;a.notes=$('#eNotes').value;
    if($('#eLoc')){if(($('#eLoc').value||'')!==(a.location||'')){a.leave=null;a.travel_min=null}a.location=$('#eLoc').value.trim();a.link=$('#eLink').value.trim()}
    document.querySelectorAll('[data-si]').forEach(inp=>a.steps[+inp.dataset.si].t=inp.value);
    document.querySelectorAll('[data-sm]').forEach(inp=>{const v=parseInt(inp.value);if(v>0)a.steps[+inp.dataset.sm].m=v;else delete a.steps[+inp.dataset.sm].m});
    const ns=$('#eNewStep').value.trim();if(ns){a.steps.push({t:ns,d:false});$('#eNewStep').value=''}
    if(a.kind==='event'){a.date=$('#eDate').value||S.date;if($('#eStart')&&!$('#eStart').disabled)a.start=$('#eStart').value||'';
      const c=parseInt($('#eDurC').value);if(c>0&&!document.querySelector('[data-dur].on'))a.duration=c}
  }
  function draw(){openSheet(html());bind()}
  function bind(){
    const B=$('#sheetBody');
    $('#eEm').onclick=()=>$('#emPick').classList.toggle('hidden');
    $('#eTitle').oninput=()=>{const v=$('#eTitle').value;
      if(!picked){const g=PacelySmart.guess(v);if(g){a.emoji=g.emoji;a.color=g.color;$('#eEm').textContent=g.emoji;$('#eEm').style.background=g.color}}
      if($('#eHint'))$('#eHint').textContent=smartHint(v).hint};
    B.querySelectorAll('[data-rcp]').forEach(b=>b.onclick=()=>{const r=recent[+b.dataset.rcp];
      Object.assign(a,{title:r.title,emoji:r.emoji,color:r.color,duration:r.duration,steps:(r.steps||[]).map(x=>({...x}))});
      if(r.start&&!(a.date===S.today&&toMin(r.start)<nowMin()))a.start=r.start;picked=true;draw()});
    B.querySelectorAll('[data-when]').forEach(b=>b.onclick=()=>{grab();const v=b.dataset.when;touched.start=true;
      if(v==='allday'){a.allday=a.allday||'day';a.start=''}else if(v==='any'){a.allday='';a.start=''}else{a.allday='';a.start=a.start||(a.date===S.today?fmt(Math.ceil(nowMin()/15)*15):'09:00')}draw()});
    B.querySelectorAll('[data-adt]').forEach(b=>b.onclick=()=>{grab();a.allday=b.dataset.adt;
      const k={office:['🏢','#9AA8BA','In the office'],home:['🏠','#73CBA8','Working from home'],off:['🌴','#73CBA8','Day off'],sick:['🤒','#9AA8BA','Sick day'],holiday:['✈️','#7CB8F0','Holiday']}[a.allday];
      if(k&&!picked){a.emoji=k[0];a.color=k[1];if(!a.title.trim())a.title=k[2]}draw()});
    if($('#eNag'))$('#eNag').onclick=()=>{grab();a.nag=a.nag?0:1;draw()};
    if($('#eTrip'))$('#eTrip').onclick=async()=>{grab();if(!a.location){toast('Add where it is first');return}
      $('#eTripT').textContent='Working it out…';
      try{const t=await api('/api/trip',{method:'POST',body:{place:a.location,date:a.date,start:a.start}});
        if(t.error){$('#eTripT').textContent=t.error;return}
        a.travel_min=t.minutes;a.travel_by=t.by;a.leave=t.leave||null;$('#eTripT').textContent=tripText(a)+(t.leave?`, arriving ${t.buffer} min early`:'')}catch(e){$('#eTripT').textContent=''}};
    if($('#ePriv'))$('#ePriv').onclick=()=>{grab();a.private=a.private?0:1;draw()};
    B.querySelectorAll('[data-em]').forEach(b=>b.onclick=()=>{grab();a.emoji=b.dataset.em;picked=true;draw()});
    $('#eEmT').oninput=e=>{const v=e.target.value.trim();if(v){a.emoji=v;picked=true;$('#eEm').textContent=v}};
    B.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{grab();a.color=b.dataset.col;picked=true;draw()});
    $('#eColC').onchange=e=>{grab();a.color=e.target.value.toUpperCase();draw()};
    B.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{grab();a.priority=b.dataset.pr;draw()});
    if($('#eAI'))$('#eAI').onclick=async()=>{grab();if(!a.title.trim()){toast('Give it a name first');return}
      const btn=$('#eAI');btn.textContent='✨ Thinking…';btn.disabled=true;
      try{const r=await aiCall('/api/ai/breakdown',{title:a.title,notes:a.notes});
        a.steps=a.steps.concat(r.steps||[]);if(a.emoji==='📝'&&r.emoji)a.emoji=r.emoji;if(r.minutes&&a.kind==='event')a.duration=r.minutes;draw();toast('Steps added – edit them however you like')}
      catch(e){btn.textContent='✨ Break it down';btn.disabled=false}};
    if(a.kind==='event'){
      if($('#eStart'))$('#eStart').onchange=()=>{touched.start=true};
      $('#eDate').onchange=()=>{touched.date=true};
      B.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{grab();a.duration=+b.dataset.dur;touched.dur=true;draw()});
      $('#eDurC').oninput=e=>{const v=parseInt(e.target.value);if(v>0){a.duration=v;B.querySelectorAll('[data-dur]').forEach(x=>x.classList.remove('on'))}};
      B.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{grab();touched.rep=true;a.repeat.type=b.dataset.rep;if(a.repeat.type==='days'&&!a.repeat.days.length)a.repeat.days=[(parse(a.date).getDay()+6)%7];draw()});
      B.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{grab();const i=+b.dataset.day;a.repeat.days=a.repeat.days.includes(i)?a.repeat.days.filter(x=>x!==i):[...a.repeat.days,i].sort();draw()});
      B.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{grab();a.remind=+b.dataset.rem;draw()});
      $('#eEnd').onclick=()=>{grab();a.end_alert=a.end_alert?0:1;draw()};
    }
    B.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{grab();a.steps.splice(+b.dataset.sd,1);draw()});
    $('#eAddStep').onclick=()=>{grab();draw();setTimeout(()=>$('#eNewStep').focus(),50)};
    $('#eNewStep').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();grab();draw();setTimeout(()=>$('#eNewStep').focus(),50)}};
    $('#eCancel').onclick=closeSheet;
    $('#eSave').onclick=save;
  }
  async function save(){
    grab();
    if(!a.title.trim()){toast('Give it a name first');$('#eTitle').focus();return}
    if(!it&&a.kind==='event'){const p=PacelySmart.parse(a.title,S.today);
      if(p.title&&(p.date||p.start||p.allday||p.duration||p.repeat)){a.title=p.title;
        if(p.date&&!touched.date)a.date=p.date;if(p.allday&&!touched.start){a.allday=p.allday;a.start=''}else if(p.start&&!touched.start){a.start=p.start;a.allday=''}
        if(p.duration&&!touched.dur)a.duration=p.duration;if(p.repeat&&!touched.rep)a.repeat=p.repeat}}
    const body={title:a.title,emoji:a.emoji,color:a.color,notes:a.notes,steps:a.steps.filter(s=>s.t.trim()),kind:a.kind,private:!!a.private,nag:!!a.nag};
    if(a.kind==='todo')body.priority=a.priority||'soon';
    if(a.kind==='event'){Object.assign(body,{date:a.date,start:a.allday?null:(a.start||null),allday:a.allday||'',duration:a.duration,remind:a.remind,end_alert:a.end_alert,repeat:a.repeat})
      if(!a.allday)Object.assign(body,{location:a.location||'',link:a.link||'',leave:a.leave||null,travel_min:a.travel_min||null,travel_by:a.travel_by||null})}
    if(it&&!pre.plan){
      if(it.master_id){
        const sc=await choose('Change repeating activity',[{label:'Just this one',value:'this'},{label:'This and all future ones',value:'all'}]);
        if(!sc)return draw();body.scope=sc;
        if(sc==='this'){delete body.repeat}
        if(sc==='all'){delete body.date}
      }else if(JSON.stringify(a.repeat)===origRepeat||a.repeat.type==='none'){delete body.repeat}
      await api('/api/activities/'+it.id,{method:'PUT',body});
    }else if(it&&pre.plan){ // plan a todo: convert in place
      await api('/api/activities/'+it.id,{method:'PUT',body:{...body,kind:'event'}});toast('Added to '+(a.date===S.today?'today':a.date));
    }else{await api('/api/activities',{method:'POST',body});}
    sheetClose=null;closeSheet();
    if(pre.plan||(a.kind==='event'&&S.view!=='today')){S.date=a.date;go('today')}else{if(a.kind==='event')S.date=a.date;refresh()}
  }
  draw();setTimeout(()=>{if(!it)$('#eTitle')&&$('#eTitle').focus()},300);
}

function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1600;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.85))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};img.src=url})}

/* ---------- focus ---------- */
let F=lsGet('focus',{total:25*60,left:25*60,end:null,running:false,itemId:null,title:'',emoji:'⏳',color:COLORS[6],steps:[]});
let fTick=null,fLastStep=-1;
function fLeft(){return F.running?Math.max(0,Math.round((F.end-Date.now())/1000)):F.left}
function saveF(){lsSet('focus',F)}
function timedSteps(){const st=F.steps||[];return st.length&&st.every(x=>x.m)?st:null}
function stepAt(elapsed){const st=timedSteps();if(!st)return null;let acc=0;
  for(let i=0;i<st.length;i++){const len=st[i].m*60;if(elapsed<acc+len)return{i,left:acc+len-elapsed,len};acc+=len}
  return{i:st.length-1,left:0,len:st[st.length-1].m*60}}
function startFocusFor(it){
  const st=toMin(it.start);let mins=it.duration;
  const steps=(it.steps||[]).map(x=>({...x}));
  if(steps.length&&steps.every(x=>x.m))mins=steps.reduce((a,b)=>a+b.m,0);
  else if(it.start&&it.date===S.today){const n=nowMin();if(n>=st&&n<st+it.duration)mins=Math.max(1,Math.round(st+it.duration-n))}
  F={total:mins*60,left:mins*60,end:null,running:false,itemId:it.kind==='cal'?null:it.id,title:it.title,emoji:it.emoji,color:it.color,steps};
  saveF();go('focus').then(()=>fStart());
}
function tellNative(){
  if(F.running)native({type:'focus',end:F.end,start:F.end-F.total*1000,title:F.title||'Focus',emoji:F.emoji||'⏳',color:F.color,itemId:typeof F.itemId==='number'?F.itemId:0});
  else native({type:'focusStop'});
}
function fStart(){sfx('focus-start');if(fLeft()<=0)F.left=F.total;F.end=Date.now()+F.left*1000;F.running=true;saveF();
  api('/api/focus',{method:'POST',body:{end:F.end,total:F.total,title:F.title?`${F.emoji} ${F.title}`:'',item:typeof F.itemId==='number'?F.itemId:0,color:F.color}}).catch(()=>{});tellNative();renderFocus();chime(true)}
async function adoptServerFocus(){
  try{const f=await api('/api/focus');
    if(f&&f.end&&f.end>Date.now()&&!(F.running&&Math.abs(F.end-f.end)<2000)){
      F={total:f.total||Math.round((f.end-Date.now())/1000),left:0,end:f.end,running:true,itemId:f.item||null,title:(f.title||'Focus').replace(/^\S+\s/,''),emoji:(f.title||'⏳ ').split(' ')[0]||'⏳',color:f.color||COLORS[6],steps:[]};
      if(F.itemId){const it=findItem(F.itemId);if(it)F.steps=(it.steps||[]).map(x=>({...x}))}
      saveF()}
    else if(F.running&&(!f||!f.end)&&F.end<Date.now()){F.running=false;F.left=0;saveF()}
  }catch(e){}
}
function fPause(){sfx('pause');F.left=fLeft();F.running=false;F.end=null;saveF();api('/api/focus',{method:'POST',body:{}}).catch(()=>{});tellNative();renderFocus()}
function fReset(m){F.running=false;F.end=null;if(m){F.total=m*60}F.left=F.total;saveF();api('/api/focus',{method:'POST',body:{}}).catch(()=>{});tellNative();renderFocus()}
let actx=null;
function chime(soft,short){if(!soft){sfx(short?'next-step':'timer',()=>chimeSynth(soft,short));return}chimeSynth(soft,short)}
function chimeSynth(soft,short){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(soft)return;const notes=short?[659.25,783.99]:[523.25,659.25,783.99];
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+i*.35;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.6);o.start(t);o.stop(t+1.7)})}catch(e){}}
function pieSVG(frac,color){
  const r=48,cx=50,cy=50;frac=Math.max(0,Math.min(1,frac));
  let path='';
  if(frac>=.9999)path=`<circle cx="50" cy="50" r="${r}" fill="${color}"/>`;
  else if(frac>0){const a=frac*2*Math.PI;const x=cx+r*Math.sin(a),y=cy-r*Math.cos(a);
    path=`<path d="M50 50 L50 ${cy-r} A${r} ${r} 0 ${frac>.5?1:0} 1 ${x.toFixed(3)} ${y.toFixed(3)} Z" fill="${color}"/>`}
  let ticks='';for(let i=0;i<12;i++){const a=i/12*2*Math.PI;ticks+=`<line x1="${50+45*Math.sin(a)}" y1="${50-45*Math.cos(a)}" x2="${50+48.5*Math.sin(a)}" y2="${50-48.5*Math.cos(a)}" stroke="var(--muted)" stroke-width=".8" opacity=".5"/>`}
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="var(--card2)"/>${path}${ticks}</svg>`;
}
function stepLabel(left){const sa=stepAt(F.total-left);if(!sa)return '';const st=timedSteps();
  return `<div class="card" style="margin:8px auto 0;max-width:360px"><div class="t" style="font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)">Step ${sa.i+1} of ${st.length}</div>
  <div style="font-size:19px;font-weight:700;margin:2px 0">${esc(st[sa.i].t)}</div><div class="sub">${fmt2(Math.round(sa.left))} left in this step${sa.i<st.length-1?` · next: ${esc(st[sa.i+1].t)}`:''}</div></div>`}
function renderFocus(){
  clearInterval(fTick);

  <div class="timer"><div id="fPie">${pieSVG(left/F.total,F.color)}</div><div class="c"><b id="fClock">${fmt2(left)}</b></div></div>
  <div id="fStep">${stepLabel(left)}</div>
  <div class="ctrl">${F.running?`<button class="btn pri" id="fPause" style="min-width:130px">❚❚ Pause</button>`:`<button class="btn pri" id="fGo" style="min-width:130px">▶ ${left<F.total&&left>0?'Resume':'Start'}</button>`}

  ${steps.length?`<div class="card steps" style="text-align:left;margin-top:20px;padding:4px 14px">${steps.map((s,i)=>`<div class="st ${s.d?'on':''}" ${sa&&sa.i===i&&F.running?'style="font-weight:700"':''}><span>${sa&&sa.i===i?'▶ ':''}${esc(s.t)}${s.m?` <small class="muted">· ${s.m} min</small>`:''}</span><button class="chk ${s.d?'on':''}" data-fs="${i}">✓</button></div>`).join('')}</div>`:''}
  ${F.itemId?`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn sm" id="fDone">✓ Mark activity done</button><button class="btn sm" id="fClear">Clear activity</button></div>`:F.title?`<div class="row" style="justify-content:center;margin-top:16px"><button class="btn sm" id="fClear">Clear</button></div>`:''}
  <p class="sub" style="margin-top:22px">${timedSteps()?'Each step has its own time. You’ll hear a soft chime when it’s time to move on. ':''}You’ll get a notification when time’s up, even if your phone is locked.</p></div>`;
  if($('#fGo'))$('#fGo').onclick=fStart;

  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>fReset(+b.dataset.p));
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.fs;F.steps[i].d=!F.steps[i].d;saveF();renderFocus();
    if(F.itemId)await api('/api/activities/'+F.itemId,{method:'PUT',body:{steps:F.steps}}).catch(()=>{})});
  if($('#fDone'))$('#fDone').onclick=async()=>{await api('/api/activities/'+F.itemId,{method:'PUT',body:{done:true,steps:F.steps.map(x=>({...x,d:true}))}});toast('Done! 🎉');F.itemId=null;F.title='';F.steps=[];F.emoji='⏳';fReset()};
  if($('#fClear'))$('#fClear').onclick=()=>{F.itemId=null;F.title='';F.steps=[];F.emoji='⏳';F.color=COLORS[6];fReset(25)};
  if(F.running)fTick=setInterval(()=>{
    if(S.view!=='focus'){clearInterval(fTick);return}
    const l=fLeft();$('#fClock').textContent=fmt2(l);$('#fPie').innerHTML=pieSVG(l/F.total,F.color);
    const sa=stepAt(F.total-l);
    if(sa){if(sa.i!==fLastStep&&l>0){ // moved to next step
        if(fLastStep>=0&&F.steps[fLastStep]){F.steps[fLastStep].d=true;saveF();if(F.itemId)api('/api/activities/'+F.itemId,{method:'PUT',body:{steps:F.steps}}).catch(()=>{})}
        chime(false,true);toast('Next step: '+F.steps[sa.i].t);fLastStep=sa.i;renderFocus();return}
      $('#fStep').innerHTML=stepLabel(l)}
    if(l<=0){clearInterval(fTick);F.running=false;F.left=0;F.end=null;saveF();chime();toast('Time’s up! Take a breath 🌿');
      api('/api/focus/log',{method:'POST',body:{minutes:Math.round(F.total/60),title:F.title}}).catch(()=>{});native({type:'focusStop'});
      try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}renderFocus()}
  },500);
}

/* ---------- backups and moving between devices ---------- */
function backupName(){return `pacely-backup-${iso(new Date())}.json`}
async function doExportText(){
  if(MODE==='local'){await LOCAL.ready;return LOCAL.exportText()}
  const r=await fetch('/api/export',{credentials:'same-origin'});if(!r.ok)throw new Error('Couldn’t make a backup');return await r.text();
}
window.pacelyExportText=doExportText;
async function exportBackup(){
  if(IS_NATIVE){native({type:'exportDb'});return}
  try{const text=await doExportText();
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=backupName();
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
    if(MODE==='local'){LOCAL.markBackedUp();S.me.last_backup=new Date().toISOString()}
    toast('Saved a copy to your Downloads')}catch(e){toast(e.message||'Couldn’t save a copy')}
}
/** Load a backup file. mode is 'merge' (keep current, add new) or 'replace'. Used by the page and by the Mac app's File menu. */
async function doImport(text,mode){
  let data;try{data=typeof text==='string'?JSON.parse(text):text}catch(e){throw new Error('That file isn’t a Pacely backup.')}
  if(MODE==='local'){const r=LOCAL.importData(data,mode);return r}
  const feats=(S.me&&S.me.features)||[];
  if(mode==='merge'&&!feats.includes('merge'))throw new Error('Your server needs updating before it can merge files. Choose Replace, or update the server first.');
  return await api('/api/import',{method:'POST',body:Object.assign({},data,{mode})});
}
window.pacelyImport=async(text,mode)=>{const r=await doImport(text,mode);try{go(S.view)}catch(e){}return r};
async function changeWhere(){
  if(IS_NATIVE){native({type:'changeStorage'});return}
  const v=await choose('Use a Pacely server instead?',[{label:'Save a copy of my plans first',value:'save'},{label:'Go to my server',value:'go'}]);
  if(v==='save'){await exportBackup();return}
  if(v==='go'){showWelcome();setTimeout(()=>{const d=document.querySelector('details');if(d)d.open=true},50)}
}

/* ---------- reminders when plans are kept in this browser ---------- */
const remindedKeys=new Set(lsGet('reminded',[]));
function showLocalNote(title,body,tag){
  chime(false,true);toast(`${title}: ${body}`);
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const opts={body,tag,icon:'icon-192.png'};
  (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null))
    .then(r=>{if(r&&r.showNotification)return r.showNotification(title,opts);new Notification(title,opts)})
    .catch(()=>{try{new Notification(title,opts)}catch(e){}});
}
async function localReminderTick(){
  if(MODE!=='local'||IS_NATIVE||!LOCAL.hasData)return;
  let up;try{up=await LOCAL.call('GET','/api/upcoming')}catch(e){return}
  const now=Date.now();let changed=false;
  const fire=(key,when,title,body)=>{if(now>=when&&now-when<10*60000&&!remindedKeys.has(key)){remindedKeys.add(key);changed=true;showLocalNote(title,body,key)}};
  for(const it of up.items){
    if(it.done)continue;
    const st=new Date(`${it.date}T${it.start}:00`).getTime(),en=st+it.duration*60000,label=`${it.emoji||''} ${it.title}`.trim(),k=`${it.id}-${it.date}-${it.start}`;
    if(it.remind>0)fire(k+'-b',st-it.remind*60000,`Coming up in ${it.remind} min`,label);
    if(it.remind>=0)fire(k+'-s',st,'Time to start',label);
    if(it.end_alert&&it.duration>=10)fire(k+'-e',en-300000,'5 minutes left',`${label} – start wrapping up`);
  }
  if(up.focus&&up.focus.end)fire('focus-'+up.focus.end,up.focus.end,'Focus time is up',up.focus.title||'Nice work. Take a breath.');
  if(changed)lsSet('reminded',[...remindedKeys].slice(-300));
}
setInterval(localReminderTick,20000);
/* Tidy a linked calendar: working hours only, no repeating blocks, no copies of things already in Pacely */
function calRules(cal){
  const on=!!cal.hours_from;
  openSheet(`<h3>${esc(cal.emoji)} Tidy ${esc(cal.name)}</h3>
  <div class="set"><div class="l"><b>Only show my working hours</b><small>Things starting outside these hours don't show in Pacely</small></div><input type="checkbox" id="crOn" ${on?'checked':''} style="width:24px;height:24px"></div>
  <div class="row"><input type="time" id="crFrom" value="${esc(cal.hours_from||'09:00')}"><input type="time" id="crTo" value="${esc(cal.hours_to||'15:30')}"></div>
  <div class="set"><div class="l"><b>Hide repeating blocks</b><small>Like focus time or out-of-office every day. One-off meetings still show.</small></div><input type="checkbox" id="crRep" ${cal.hide_repeats?'checked':''} style="width:24px;height:24px"></div>
  <div class="set"><div class="l"><b>Hide if it's already in Pacely</b><small>Something at the same time in Pacely? Only the Pacely one shows.</small></div><input type="checkbox" id="crDup" ${cal.hide_dupes!==0?'checked':''} style="width:24px;height:24px"></div>
  <div style="display:grid;gap:10px;margin-top:16px"><button class="btn pri block" id="crSave">Save</button><button class="btn block" id="crX">Cancel</button></div>`);
  $('#crX').onclick=closeSheet;
  $('#crSave').onclick=async()=>{const o=$('#crOn').checked;await api('/api/calendars/'+cal.id,{method:'PUT',body:{hours_from:o?$('#crFrom').value:'',hours_to:o?$('#crTo').value:'',
    hide_repeats:$('#crRep').checked,hide_dupes:$('#crDup').checked}});closeSheet();sfx('toggle-on');toast('Calendar tidied');go('me')};
}
function calSheet(){
  let color=COLORS[9];
  openSheet(`<h3>Link a calendar</h3>
  <div class="card sub" style="margin-top:10px;line-height:1.5"><b>Google:</b> calendar.google.com on a computer → Settings → your calendar → <i>Secret address in iCal format</i>.<br>
  <b>iCloud:</b> Calendar app → tap ⓘ by the calendar → turn on <i>Public Calendar</i> → Share Link.<br><b>Outlook:</b> Settings → Calendar → Shared calendars → Publish → ICS link.</div>
  <label class="f">Name</label><input type="text" id="calName" placeholder="Work">
  <label class="f">Calendar link</label><input type="text" id="calUrl" placeholder="https://… or webcal://…" autocapitalize="off" autocorrect="off">
  <label class="f">Emoji</label><input type="text" id="calEm" value="📅" maxlength="8" style="width:80px">
  <label class="f">Colour</label><div class="swatches">${COLORS.map(c=>`<button data-cc="${c}" style="--c:${c}" class="${c===color?'on':''}" aria-label="colour"></button>`).join('')}</div>
  <label class="f">Remind me</label><div class="choices">${[[0,'At start'],[5,'5 min before'],[10,'10 min'],[15,'15 min'],[30,'30 min']].map(([v,l])=>`<button class="choice ${v===10?'on':''}" data-cr="${v}">${l}</button>`).join('')}</div>
  <button class="btn pri block" style="margin-top:18px" id="calSave">Link calendar</button>`);
  $('#sheetBody').querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{color=b.dataset.cc;$('#sheetBody').querySelectorAll('[data-cc]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#sheetBody').querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>$('#sheetBody').querySelectorAll('[data-cr]').forEach(x=>x.classList.toggle('on',x===b)));
  $('#calSave').onclick=async()=>{const btn=$('#calSave');btn.textContent='Linking…';btn.disabled=true;
    try{const r=await api('/api/calendars',{method:'POST',body:{name:$('#calName').value||'Calendar',url:$('#calUrl').value,emoji:$('#calEm').value,color,remind:+document.querySelector('[data-cr].on').dataset.cr}});
      closeSheet();toast(r.error?'Linked, but it couldn’t be read yet: '+r.error:`Linked – ${r.events} events found`);go('me')}
    catch(e){btn.textContent='Link calendar';btn.disabled=false}};
}
function pwSheet(){
  openSheet(`<h3>Change password</h3><label class="f">Current password</label><input type="password" id="pOld" autocomplete="current-password">
  <label class="f">New password</label><input type="password" id="pNew" autocomplete="new-password"><button class="btn pri block" style="margin-top:18px" id="pSave">Save</button>`);
  $('#pSave').onclick=async()=>{await api('/api/password',{method:'POST',body:{old:$('#pOld').value,new:$('#pNew').value}});closeSheet();toast('Password changed')};
}
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function enablePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast(/iPhone|iPad/.test(navigator.userAgent)?'Add Pacely to your Home Screen first, then open it from there':'This browser can’t do notifications');return}
    if(!window.isSecureContext){toast('Notifications need the https:// address (your Cloudflare link)');return}
    const p=await Notification.requestPermission();if(p!=='granted'){toast('Notifications weren’t allowed');go('me');return}
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(S.me.vapid)});
    await api('/api/push/subscribe',{method:'POST',body:{sub:sub.toJSON()}});
    toast('Reminders are on 🔔');go('me');
  }catch(e){console.error(e);toast('Couldn’t turn on notifications: '+(e.message||e))}
}

/* keep the timeline fresh */
setInterval(()=>{if(S.view==='today'&&!$('#sheet').classList.contains('on')&&document.visibilityState==='visible')loadDay().catch(()=>{})},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.me){if(S.view==='today')loadDay().catch(()=>{});if(S.view==='focus')renderFocus()}});
start().catch(()=>{});
