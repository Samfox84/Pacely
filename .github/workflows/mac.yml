# Builds Pacely for Mac (one app for both Apple silicon and Intel) and puts Pacely-Mac.zip on a GitHub Release
# named after the version in VERSION. Runs by itself when the Mac app or the web app changes on main,
# or by hand: Actions › "Pacely for Mac" › Run workflow.
# The app is signed "ad hoc" (no paid Apple account), so the first time people open it they right-click › Open.
name: Pacely for Mac
on:
  push:
    branches: [main]
    paths: ['mac/**', 'server/static/**', 'VERSION', '.github/workflows/mac.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (Apple silicon + Intel)
        working-directory: mac
        run: |
          VERSION=$(cat ../VERSION)
          xcodebuild -project PacelyMac.xcodeproj -target PacelyMac -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO SYMROOT="$PWD/build" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" | tail -25
          test -d build/Release/Pacely.app
          lipo -archs build/Release/Pacely.app/Contents/MacOS/Pacely
          test -f build/Release/Pacely.app/Contents/Resources/index.html
          test -f build/Release/Pacely.app/Contents/Resources/local.js
          ditto -c -k --keepParent build/Release/Pacely.app "$RUNNER_TEMP/Pacely-Mac.zip"
      - name: Put it on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG="v$VERSION"
          # Friendly release notes in docs/releases/<version>.md make it a full release; otherwise the changelog entry, as a pre-release
          if [ -f "docs/releases/$VERSION.md" ]; then NOTES=$(cat "docs/releases/$VERSION.md"); PRE=""; TITLE=$(head -c 0 /dev/null; echo "Pacely $VERSION")
          else NOTES=$(awk -v v="## $VERSION" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md); PRE="--prerelease"; TITLE="Pacely $VERSION"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/Pacely-Mac.zip" --clobber
            if [ -z "$PRE" ]; then gh release edit "$TAG" --notes "$NOTES" --title "$TITLE" --prerelease=false --latest; fi
          else
            gh release create "$TAG" "$RUNNER_TEMP/Pacely-Mac.zip" --title "$TITLE" --notes "$NOTES" $PRE --target "$GITHUB_SHA"
          fi
