# Builds the iPhone, widget and Apple Watch apps on a Mac to check everything compiles.
# (It doesn't sign or publish anything: to put Pacely on your iPhone, build it in Xcode. See ios/README.md.)
name: iPhone and Watch build check
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build for the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Pacely.xcodeproj -list
          xcodebuild -project ios/Pacely.xcodeproj -scheme Pacely -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath "$PWD/dd" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
